<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px;">
  <h2>Lista Maestra de Estudiantes</h2>

  <mat-form-field appearance="outline" style="width: 100%; max-width: 800px;">
    <mat-label> Buscar por nombre o apellido...</mat-label>
    <input matInput [formControl]="controlBuscador" placeholder="Ej. Alvaro">
  </mat-form-field>

  @if ((estudiantesFiltrados$ | async)?.length === 0) {
    <div style="text-align: center; margin-top: 20px;">
      <p style="color: gray;">No se encontraron registros.</p>
      <button mat-raised-button color="accent" (click)="irAlRegistro()">Registrar Nuevo Estudiante</button>
    </div>
  } @else {
    <div class="contenedor-tabla mat-elevation-z8" style="width: 100%; max-width: 1000px; overflow-x: auto; border-radius: 8px;">
      
      <table mat-table [dataSource]="(estudiantesFiltrados$ | async) || []" style="width: 100%;">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef> Estudiante </th>
          <td mat-cell *matCellDef="let est"> {{ est.nombres }} {{ est.apellidos }} </td>
        </ng-container>

        <ng-container matColumnDef="telefono">
          <th mat-header-cell *matHeaderCellDef> Teléfono </th>
          <td mat-cell *matCellDef="let est"> {{ est.telefono }} </td>
        </ng-container>

        <ng-container matColumnDef="colegio">
          <th mat-header-cell *matHeaderCellDef> Colegio </th>
          <td mat-cell *matCellDef="let est"> {{ est.colegio }} </td>
        </ng-container>

        <ng-container matColumnDef="curso">
          <th mat-header-cell *matHeaderCellDef> Curso </th>
          <td mat-cell *matCellDef="let est"> {{ est.curso }} </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;"> Acciones </th>
          <td mat-cell *matCellDef="let est" style="text-align: center;">
            <button mat-button color="primary" (click)="editar(est)">Editar</button>
            <button mat-button color="warn" (click)="eliminar(est.id)">Eliminar</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnasMostradas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnasMostradas;"></tr>
      </table>

    </div>
  }
</div>
