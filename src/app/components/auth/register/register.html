<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>Crea tu cuenta</mat-card-title>
            <mat-card-subtitle>Únete a Vaixs ERP</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Usuario</mat-label>
                    <input matInput formControlName="username" placeholder="Elige un nombre de usuario">
                    <mat-icon matSuffix>person</mat-icon>
                    <mat-error *ngIf="registerForm.get('username')?.hasError('required')">El usuario es
                        requerido</mat-error>
                    <mat-error *ngIf="registerForm.get('username')?.hasError('minlength')">Mínimo 4
                        caracteres</mat-error>
                </mat-form-field>

                <div class="role-selection-container">
                    <label class="role-label">Selecciona tu Rol</label>
                    <mat-button-toggle-group formControlName="role" class="role-toggle-group">
                        <mat-button-toggle value="admin">
                            <mat-icon>admin_panel_settings</mat-icon> Admin
                        </mat-button-toggle>
                        <mat-button-toggle value="vendedor">
                            <mat-icon>store</mat-icon> Vendedor
                        </mat-button-toggle>
                    </mat-button-toggle-group>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Contraseña</mat-label>
                    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                        placeholder="Crea una contraseña segura">
                    <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
                        <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('required')">La contraseña es
                        requerida</mat-error>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Mínimo 6
                        caracteres</mat-error>
                </mat-form-field>

                <button mat-raised-button color="accent" class="full-width login-btn" type="submit"
                    [disabled]="registerForm.invalid">
                    REGISTRARSE
                </button>
            </form>
        </mat-card-content>

        <mat-card-footer>
            <div class="register-link">
                ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
            </div>
        </mat-card-footer>
    </mat-card>
</div>
