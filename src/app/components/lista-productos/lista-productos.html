<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1000px; flex-wrap: wrap; gap: 10px;">
    <h2> Gestión de Inventario</h2>
    <button mat-raised-button color="primary" (click)="abrirFormulario()">
      + Nuevo Producto
    </button>
  </div>

  <mat-form-field appearance="outline" style="width: 100%; max-width: 1000px;">
    <mat-label> Buscar por nombre o categoría...</mat-label>
    <input matInput [formControl]="controlBuscador" placeholder="Ej. Laptop">
  </mat-form-field>

  @if ((productosFiltrados$ | async)?.length === 0) {
    <div style="text-align: center; margin-top: 40px;">
      <p style="color: gray;">El inventario está vacío.</p>
      <button mat-raised-button color="accent" (click)="abrirFormulario()">
        Registrar Primer Producto
      </button>
    </div>
  } @else {
    <div class="contenedor-tabla mat-elevation-z8" style="width: 100%; max-width: 1000px; overflow-x: auto; border-radius: 8px;">
      
      <table mat-table [dataSource]="(productosFiltrados$ | async) || []" style="width: 100%;">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef> Producto </th>
          <td mat-cell *matCellDef="let p" style="font-weight: 500;"> {{ p.nombre }} </td>
        </ng-container>

        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef> Categoría </th>
          <td mat-cell *matCellDef="let p"> 
            <span style="background: #e3f2fd; color: #1565c0; padding: 4px 8px; border-radius: 12px; font-size: 11px; white-space: nowrap;">
              {{ p.categoria }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef> Precio </th>
          <td mat-cell *matCellDef="let p"> Bs {{ p.precio | number:'1.2-2' }} </td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef> Stock </th>
          <td mat-cell *matCellDef="let p"> 
            <span [style.color]="p.stock < 5 ? '#d32f2f' : '#2e7d32'" [style.fontWeight]="p.stock < 5 ? 'bold' : 'normal'">
              {{ p.stock }} un.
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;"> Acciones </th>
          <td mat-cell *matCellDef="let p" style="text-align: center;">
            <button mat-button color="primary" (click)="abrirFormulario(p)">Editar</button>
            <button mat-button color="warn" (click)="eliminar(p.id)">Borrar</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnasMostradas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnasMostradas;"></tr>
      </table>

    </div>
  }
</div>
