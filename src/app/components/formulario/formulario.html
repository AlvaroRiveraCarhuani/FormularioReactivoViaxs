<h2 mat-dialog-title style="color: #005cbb; text-align: center;">
  {{ datos ? 'Editar Estudiante' : 'Nuevo Estudiante' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="formularioEstudiante" style="display: flex; flex-direction: column; gap: 10px; min-width: 400px; padding-top: 10px;">
    <div style="display: flex; gap: 10px;">
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Nombres</mat-label>
        <input matInput formControlName="nombres">
      </mat-form-field>
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Apellidos</mat-label>
        <input matInput formControlName="apellidos">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Número de Teléfono</mat-label>
      <input matInput formControlName="telefono">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Colegio de procedencia</mat-label>
      <input matInput formControlName="colegio">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Curso / Grado actual</mat-label>
      <mat-select formControlName="curso">
        @for (curso of cursosDisponibles; track curso) {
          <mat-option [value]="curso">{{ curso }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo de contacto</mat-label>
      <input matInput formControlName="correo" type="email">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" style="padding: 20px;">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="formularioEstudiante.invalid" (click)="guardar()">
    {{ datos ? 'Actualizar' : 'Registrar' }}
  </button>
</mat-dialog-actions>
